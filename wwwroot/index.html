<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyNotes</title>
</head>
<body>
    <main>
        <h1>StudyNotes</h1>
        <button type="button" id="reloadNotes">Reload notes</button>
        <p id="notesStatus" role="status"></p>
        <div id="notes"></div>
        <form id="addForm">
            <label for="titleInput">Title:</label>
            <input id="titleInput" type="text" required maxlength="200">
            <label for="contentInput">Content:</label>
            <textarea id="contentInput" required maxlength="20000" rows="6"></textarea>
            <label for="tagInput">Tag (optional):</label>
            <input id="tagInput" type="text" maxlength="50">
            <button type="submit">Add note</button>
            <button type="button" id="cancelEdit" hidden>Cancel editing</button>
            <div id="addError" role="alert"></div>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
