<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyNotes</title>
</head>
<body>
    <h1>StudyNotes</h1>
    
    <div id="notes"></div>

    <div>
        <form id="addForm">
            <label for="titleInput">New note title:</label>

            <input id="titleInput"
                   type="text"
                   required
                   size="14" />

            <div>
                <label for="contentInput">New note content:</label>
                <textarea id="contentInput"></textarea>
            </div>

            <div>
                <label for="tagInput">Tag (optional):</label>
                <input id="tagInput" type="text" size="14" />
            </div>

            <button type="submit">Add note</button>
            <div id="addError"></div>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
